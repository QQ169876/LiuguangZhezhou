pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

def localProperties = new Properties()
new File(settingsDir, 'local.properties').withInputStream { localProperties.load(it) }

include ':app'
include ':catvod'
include ':chaquo'
include ':quickjs'
rootProject.name = "TV"

// 老盒子兼容版：把 :chaquo 指向不带 Python 的同名空壳模块
if ('true'.equals(localProperties.getProperty('legacy'))) {
    project(':chaquo').projectDir = new File(rootDir, 'chaquo-stub')
}
